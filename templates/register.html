{% extends "base.html" %}{% block content %}
<div class="narrow"><h1>Register</h1>
<form method="POST" class="card">
  <label>Full Name</label><input type="text" name="name" required>
  <label>Email</label><input type="email" name="email" required>
  <label>I am a</label>
  <select name="role" required>{% for r in roles %}<option value="{{ r }}">{{ r }}</option>{% endfor %}</select>
  <label>Password (min 6 characters)</label><input type="password" name="password" required minlength="6">
  <label>Confirm Password</label><input type="password" name="confirm" required minlength="6">
  <button type="submit">Create Account</button>
  <p class="sub">Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
</form></div>
{% endblock %}
